name: Build EcoChat Final APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project Directory
      run: |
        # ሁሉንም ፋይሎች በትክክለኛው የአንድሮይድ መዋቅር ማደራጀት
        mkdir -p app/src/main/java/app/ecochat/beta
        mkdir -p app/src/main/res/layout
        
        [ -f MainActivity.java ] && cp MainActivity.java app/src/main/java/app/ecochat/beta/
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
        [ -f activity_main.xml ] && cp activity_main.xml app/src/main/res/layout/
        
        # በዋናው ገፅ ላይ የፈጠርናቸውን ግራድል ፋይሎች ወደ አፑ ማውጫ ማዛወር
        [ -f settings.gradle ] && cp settings.gradle .
        [ -f build.gradle ] && cp build.gradle .
        
        # ለአፑ መገንቢያ የሚሆን ንዑስ ግራድል ፋይል መፍጠር
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'app.ecochat.beta'
            compileSdk 33
            defaultConfig {
                applicationId "app.ecochat.beta"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Generate Gradle Wrapper and Build APK
      run: |
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Real Functional APK
      uses: actions/upload-artifact@v4
      with:
        name: EcoChat-Beta-APK
        path: app/build/outputs/apk/debug/app-debug.apk
