name: Build EcoChat Premium APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Generate Android Structure and Build
      run: |
        # ሙሉ የአንድሮይድ ፕሮጀክት መዋቅር በቨርቹዋል ማሽኑ ላይ በንጹህ መንገድ መገንባት
        mkdir -p app/src/main/java/app/ecochat/beta
        mkdir -p app/src/main/res/layout
        
        cp MainActivity.java app/src/main/java/app/ecochat/beta/
        cp AndroidManifest.xml app/src/main/
        cp activity_main.xml app/src/main/res/layout/
        
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.0.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'app.ecochat.beta'
            compileSdk 33
            defaultConfig {
                applicationId "app.ecochat.beta"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
        EOF

        # ግራድልን በመጠቀም መተግበሪያውን ማጠናቀር
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Functional APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EcoChat-Beta-APK
        path: app/build/outputs/apk/debug/app-debug.apk
