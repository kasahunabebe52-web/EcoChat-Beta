name: Build EcoChat Final APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Android Configuration
      run: |
        # የአንድሮይድ መዋቅር መገንቢያ አቃፊዎችን ማዘጋጀት
        mkdir -p app/src/main/java/app/ecochat/beta
        mkdir -p app/src/main/res/layout
        
        # የኮድ ፋይሎችን በትክክል ማዛወር
        [ -f MainActivity.java ] && cp MainActivity.java app/src/main/java/app/ecochat/beta/
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
        [ -f activity_main.xml ] && cp activity_main.xml app/src/main/res/layout/
        
        # የግራድል ቅንብሮችን ማስተካከል
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.0.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'app.ecochat.beta'
            compileSdk 33
            defaultConfig {
                applicationId "app.ecochat.beta"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
        EOF

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.0

    - name: Build Android Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Clean APK
      uses: actions/upload-artifact@v4
      with:
        name: EcoChat-Beta-APK
        path: app/build/outputs/apk/debug/app-debug.apk
